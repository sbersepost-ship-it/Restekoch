const findSub = (text) => { const t = text.toLowerCase(); return SUBS.find((s) => s.re.test(t)); };
// Hat der Kühlschrank alles, was der Ersatz braucht?
const subReady = (sub, fridge) => {
  if (!sub.needs.length) return false; // z. B. getrocknete Kräuter: nicht prüfbar
  const f = fridge.map((x) => x.toLowerCase());
  const has = (n) => f.some((x) => (n === 'ei' ? /^eier?$/.test(x) : x.includes(n)) || (n === 'käse' && /gouda|emmentaler|cheddar|bergkäse/.test(x)));
  return sub.any ? sub.needs.some(has) : sub.needs.every(has);
};
// Tipps für ein Rezept: zuerst fehlende Zutaten, dann Zutaten aus den Arbeitsschritten.
function tipsFor(r) {
  const out = [];
  for (const m of r.missing) {
    const s = findSub(m);
    out.push({ key: 'm:' + m, label: m, entry: s, missing: true });
  }
  const text = [...r.steps, ...(r.rows || []).flatMap((x) => x.ingredients || [])].join(' ').toLowerCase();
  for (const s of SUBS) {
    if (out.some((o) => o.entry === s)) continue;
    if (s.name === 'Käse' && out.some((o) => o.entry && /parmesan|mozzarella|feta/i.test(o.entry.name))) continue;
    if (s.name === 'Ei' && out.some((o) => o.entry && o.entry.name === 'Eigelb')) continue;
    if (s.re.test(text)) out.push({ key: 's:' + s.name, label: s.name, entry: s, missing: false });
  }
  return out;
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');

// Antwort des Chefkochs (RECIPE_SCHEMA) in die Rezeptform der App bringen.
function toRecipe(x) {
  const kind = x.category === 'einkauf' ? 'shop' : 'now';
  const rows = (x.rows || []).map((r) => ({ ingredients: r.ingredients || [], steps: r.steps || [], tools: r.tools || [] }));
  return {
    id: x.name.toLowerCase().replace(/[^a-zäöüß0-9]+/g, '-'),
    name: x.name, kind, rows,
    time: x.time_minutes ? `${x.time_minutes} Minuten` : '',
    servings: x.servings || null,
    missing: kind === 'shop' ? (x.missing || []).map((m) => m.replace(/\s*\(.*?\)/g, '').trim()).filter(Boolean) : [],
    steps: rows.flatMap((r) => r.steps),
  };
}
function groupRecipes(list) {
  const all = list.map(toRecipe);
  return [['now', 'Sofort kochbar'], ['shop', 'Mit kleinem Einkauf']]
    .map(([kind, title]) => ({ kind, title, recipes: all.filter((r) => r.kind === kind) }))
    .filter((c) => c.recipes.length);
}

function resizeImage(file, maxSide = 1568) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Das Bild konnte nicht gelesen werden. Versuch ein JPG oder PNG.'));
    img.src = URL.createObjectURL(file);
  });
}

// Entfernt mitkopierte Leerzeichen, Zeilenumbrüche und unsichtbare Zeichen.
const cleanKey = (s) => (s || '').replace(/[\s​-‍⁠﻿]/g, '');
const getKey = () => cleanKey(store.get('apiKey', ''));

// Prüft einen Schlüssel kostenlos per Token-Zählung (liefert bei falschem Schlüssel sauber 401).
async function testKey(key) {
  let Anthropic;
  try { Anthropic = await loadSdk(); } catch { sdk = null; throw new Error('Keine Internetverbindung. Prüf WLAN oder mobile Daten.'); }
  const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 0 });
  try {
    await client.messages.countTokens({ model: getModel(), messages: [{ role: 'user', content: 'Hallo' }] });
  } catch (err) {
    if (err instanceof Anthropic.AuthenticationError) throw new Error('Anthropic lehnt diesen Schlüssel ab. Erstell in der Console einen neuen und kopier ihn mit dem Kopier-Symbol.');
    if (err instanceof Anthropic.PermissionDeniedError) throw new Error('Der Schlüssel ist gültig, darf aber nichts abfragen. Prüf in der Console, ob er aktiv ist.');
    if (err instanceof Anthropic.APIConnectionError) throw new Error('Keine Verbindung zu Anthropic. Prüf deine Internetverbindung.');
    if (err instanceof Anthropic.APIError) throw new Error(`Anthropic antwortet gerade nicht (${err.status ?? 'Netzwerk'}). Versuch es gleich noch mal.`);
    throw err;
  }
}

async function claudeDirect(params) {
  let Anthropic;
  try { Anthropic = await loadSdk(); } catch { sdk = null; throw new Error('Keine Internetverbindung. Prüf WLAN oder mobile Daten.'); }
  const client = new Anthropic({ apiKey: getKey(), dangerouslyAllowBrowser: true });
  const model = getModel();
  // Bei Opus: Lehnt ein Sicherheitsfilter ab, beantwortet die API die Anfrage mit dem empfohlenen Ersatzmodell.
  // Haiku 5.5 hat keinen serverseitigen Fallback.
  const fallback = model === 'claude-opus-5-5' ? { betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' } : {};
  let msg;
  try {
    msg = await client.beta.messages.create({
      model,
      ...fallback,
      thinking: { type: 'adaptive' },
      ...params,
    });
  } catch (err) {
    if (err instanceof Anthropic.AuthenticationError) throw new Error('Der API-Schlüssel ist ungültig. Prüf ihn in den Einstellungen.');
    if (err instanceof Anthropic.PermissionDeniedError) throw new Error('Dieser API-Schlüssel darf das Modell nicht nutzen.');
    if (err instanceof Anthropic.RateLimitError) throw new Error('Zu viele Anfragen. Warte kurz und versuch es noch mal.');
    if (err instanceof Anthropic.BadRequestError) throw new Error('Claude konnte die Anfrage nicht verarbeiten. Versuch es mit einem anderen Foto oder anderen Zutaten.');
    if (err instanceof Anthropic.APIConnectionError) throw new Error('Keine Verbindung zu Claude. Prüf deine Internetverbindung.');
    if (err instanceof Anthropic.APIError) throw new Error(`Claude ist gerade nicht erreichbar (${err.status ?? 'Netzwerk'}).`);
    throw err;
  }
  if (msg.stop_reason === 'refusal') throw new Error('Darauf kann Claude keine Antwort geben.');
  return msg.content.filter((b) => b.type === 'text').map((b) => b.text).join('').trim();
}

function parseIngredientArray(text) {
  const match = text.match(/\[[\s\S]*\]/);
  if (!match) return [];
  try {
    const parsed = JSON.parse(match[0]);
    return Array.isArray(parsed) ? [...new Set(parsed.filter((x) => typeof x === 'string').map((x) => x.trim()).filter(Boolean))] : [];
  } catch { return []; }
}

// Ruft das Express-Backend auf. Ist keins erreichbar, kommt { demo: true } zurück.
async function serverCall(url, body) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch { return { demo: true }; }
  if (res.status === 404 || res.status === 405) return { demo: true };
  const data = await res.json().catch(() => null);
  if (!data) return { demo: true };
  if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
  return data;
}

async function analyzeImage(dataUrl) {
  if (!dataUrl) return { demo: true };
  if (!getKey()) return serverCall('/api/analyze-image', { image: dataUrl });
  const [, media_type, data] = dataUrl.match(/^data:(image\/[a-z]+);base64,(.+)$/);
  const text = await claudeDirect({
    max_tokens: 4000,
    output_config: { effort: 'low' },
    system: VISION_PROMPT,
    messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type, data } },
      { type: 'text', text: 'Analysiere dieses Foto.' },
    ] }],
  });
  return { ingredients: parseIngredientArray(text) };
}

async function suggestRecipes(ingredients) {
  if (!getKey()) return serverCall('/api/recipes', { ingredients });
  const text = await claudeDirect({
    max_tokens: 16000,
    output_config: { effort: 'medium', format: { type: 'json_schema', schema: RECIPE_SCHEMA } },
    system: CHEF_PROMPT,
    messages: [{ role: 'user', content: `Hier ist die Liste der vorhandenen Zutaten des Nutzers:\n${ingredients.join(', ')}` }],
  });
  try {
    return { recipes: JSON.parse(text).recipes };
  } catch {
    throw new Error('Die Rezepte kamen unvollständig an. Versuch es noch mal.');
  }
}

function SubTips({ r, fridge, swapped, onSwap }) {
  const tips = tipsFor(r);
  const [open, setOpen] = useState(() => tips.filter((t) => t.missing).map((t) => t.key));
  if (!tips.length) return null;
  const toggle = (k) => setOpen((o) => (o.includes(k) ? o.filter((x) => x !== k) : [...o, k]));
  return html`<section className="mt-5">
    <h3 className="font-display text-lg font-bold flex items-center gap-2"><${Ic.Repeat} size=${18} className="text-brand" />Ersatz-Tipps</h3>
    <p className="text-sm text-muted mt-0.5 mb-2.5">Fehlt dir etwas? Damit klappt das Rezept trotzdem.</p>
    <ul className="flex flex-col gap-2">
      ${tips.map((t) => {
        const isOpen = open.includes(t.key);
        const subs = t.entry ? t.entry.subs : [];
        const ready = subs.filter((x) => subReady(x, fridge));
        const sw = swapped[t.label];
        return html`<li key=${t.key} className=${`rounded-2xl border ${t.missing ? 'border-accent/40' : 'border-line'} bg-surface overflow-hidden`}>
          <button onClick=${() => toggle(t.key)} aria-expanded=${isOpen} className="w-full flex items-center gap-2.5 px-3.5 py-3 text-left">
            <span aria-hidden="true" className="text-lg">${emojiFor(t.label)}</span>
            <span className="flex-1 min-w-0">
              <span className=${`font-semibold block ${sw ? 'line-through text-muted' : ''}`}>${t.label}</span>
              ${sw
                ? html`<span className="text-xs font-semibold text-brand flex items-center gap-1"><${Ic.Check} size=${12} strokeWidth=${3} />Ersetzt durch ${sw}</span>`
                : html`<span className="text-xs text-muted">${t.missing ? 'Fehlt' : 'Im Rezept'}${ready.length && subs.length ? ' · Ersatz im Kühlschrank' : ''}</span>`}
            </span>
            ${ready.length > 0 && !sw && html`<span className="w-2 h-2 rounded-full bg-brand shrink-0" aria-hidden="true"></span>`}
            <${Ic.ChevronDown} size=${18} className=${`text-muted shrink-0 transition ${isOpen ? 'rotate-180' : ''}`} />
          </button>
          ${isOpen && html`<div className="px-3.5 pb-3.5 anim-fade">
            ${subs.length === 0
              ? html`<p className="text-sm text-muted">Dafür kenne ich keinen guten Ersatz. Lass die Zutat weg oder setz sie auf die Einkaufsliste.</p>`
              : html`<ul className="flex flex-col gap-2">
                ${subs.map((x) => {
                  const ok = subReady(x, fridge);
                  const chosen = sw === x.with;
                  return html`<li key=${x.with} className=${`rounded-xl px-3 py-2.5 ${chosen ? 'bg-brand-soft' : 'bg-surface2'}`}>
                    <div className="flex items-start gap-2">
                      <p className="flex-1 min-w-0 text-sm leading-snug"><b>${x.with}</b><br /><span className="text-muted">${x.how}</span></p>
                      ${ok && html`<span className="shrink-0 rounded-full bg-brand-soft text-brand text-[11px] font-bold px-2 py-0.5 flex items-center gap-1"><${Ic.Refrigerator} size=${12} />Da</span>`}
                    </div>
                    ${t.missing && html`<button onClick=${() => onSwap(t.label, chosen ? null : x.with)} className=${`mt-2 text-xs font-semibold rounded-full px-3 py-1.5 border transition ${chosen ? 'border-brand text-brand' : 'border-line text-ink hover:border-brand'}`}>
                      ${chosen ? 'Doch kaufen' : 'Das nehme ich'}
                    </button>`}
                  </li>`;
                })}
              </ul>`}
          </div>`}
        </li>`;
      })}
    </ul>
  </section>`;
}

      : html`<h3 className="font-display text-lg font-bold mt-5 mb-2">So geht's</h3>

          ${r.steps.map((s, i) => html`<li key=${i} className="flex gap-3">

            <p className="text-[15px] leading-relaxed pt-0.5 min-w-0" dangerouslySetInnerHTML=${{ __html: inline(s) }}></p>

/* ---------- Foto-Scan ---------- */
function Scanner({ onClose, onApply, onSettings }) {
  const [photo, setPhoto] = useState(null);
  const [phase, setPhase] = useState('pick'); // pick | scanning | result
  const [found, setFound] = useState([]);
  const [picked, setPicked] = useState([]);
  const [demo, setDemo] = useState(false);
  const [error, setError] = useState('');
  const fileRef = useRef(null);

  const analyze = async (dataUrl) => {
    setPhase('scanning'); setError('');
    try {
      const [data] = await Promise.all([analyzeImage(dataUrl), wait(1400)]);
      // Ein echtes Foto ohne Schlüssel bekommt keine erfundenen Zutaten.
      if (data.demo && dataUrl) { setPhase('nokey'); return; }
      const list = data.demo ? DEMO_SCAN : data.ingredients;
      setDemo(!!data.demo); setFound(list); setPicked(list); setPhase('result');
    } catch (err) {
      setError(err.message); setPhase('pick');
    }
  };
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setError('Das ist keine Bilddatei. Wähl ein Foto im JPG-, PNG- oder WebP-Format.');
    try { const url = await resizeImage(f); setPhoto(url); analyze(url); } catch (err) { setError(err.message); }
  };
  const toggle = (n) => setPicked((p) => (p.includes(n) ? p.filter((x) => x !== n) : [...p, n]));

  return html`<${Sheet} onClose=${onClose} label="Kühlschrank scannen">
    <h2 className="font-display text-[26px] font-extrabold leading-tight pr-12">Kühlschrank scannen</h2>
    <p className="text-sm text-muted mt-1">Tür auf, Foto machen. Je heller, desto besser erkennt die KI die Lebensmittel.</p>
    <input ref=${fileRef} id="scan-photo" type="file" accept="image/*" capture="environment" className="hidden" onChange=${onFile} />

    ${phase === 'pick' && html`<div className="grid grid-cols-2 gap-2 mt-5">
      <button onClick=${() => fileRef.current && fileRef.current.click()} className="rounded-2xl border-2 border-dashed border-line hover:border-brand/50 py-6 flex flex-col items-center gap-1.5 text-sm font-medium text-muted transition">
        <${Ic.Camera} size=${24} className="text-brand" />Foto aufnehmen<span className="text-xs font-normal">oder hochladen</span>
      </button>
      <button onClick=${() => { setPhoto(null); analyze(null); }} className="rounded-2xl border-2 border-dashed border-line hover:border-brand/50 py-6 flex flex-col items-center gap-1.5 text-sm font-medium text-muted transition">
        <${Ic.Wand2} size=${24} className="text-accent" />Beispiel-Scan<span className="text-xs font-normal">ohne eigenes Foto</span>
      </button>
    </div>`}

    ${phase === 'scanning' && html`<div className="relative mt-5 rounded-3xl overflow-hidden aspect-[4/3] max-w-full bg-surface2 anim-fade">
      ${photo
        ? html`<img src=${photo} alt="Dein Kühlschrankfoto" className="w-full h-full object-cover" />`
        : html`<div className="w-full h-full grid grid-cols-4 place-items-center text-[34px] p-4" aria-hidden="true">${['🥚', '🍅', '🧀', '🥛', '🥒', '🥣', '🫑', '🧈'].map((e) => html`<span key=${e}>${e}</span>`)}</div>`}
      <div className="absolute inset-0 bg-brand/10"></div>
      <div className="scanline"></div>
      <span className="absolute left-3 bottom-3 rounded-full bg-black/60 text-white text-xs px-2.5 py-1 flex items-center gap-1.5"><${Ic.Loader2} size=${12} className="animate-spin" />Erkenne Lebensmittel …</span>
    </div>`}

    ${phase === 'nokey' && html`<div className="mt-5 rounded-3xl bg-accent-soft p-5 text-center anim-fade">
      <${Ic.KeyRound} size=${26} className="mx-auto text-accent" />
      <p className="font-semibold mt-2">Für echte Fotos braucht Claude deinen Schlüssel</p>
      <p className="text-sm text-muted mt-1">Trag deinen Anthropic API-Schlüssel ein, dann erkennt Claude, was in deinem Kühlschrank liegt.</p>
      <button onClick=${onSettings} className="mt-4 w-full rounded-2xl bg-brand text-onbrand py-3.5 font-semibold flex items-center justify-center gap-2"><${Ic.KeyRound} size=${18} />API-Schlüssel eintragen</button>
      <button onClick=${() => { setPhoto(null); analyze(null); }} className="mt-2.5 w-full rounded-2xl border border-line bg-surface py-3 font-semibold text-sm text-ink">Beispiel-Scan ansehen</button>
    </div>`}

    ${phase === 'result' && html`<div className="mt-5 anim-fade">
      ${demo && html`<p className="rounded-xl bg-surface2 text-muted text-xs px-3 py-2 mb-3 flex gap-2"><${Ic.Info} size=${14} className="shrink-0 mt-px" />Kein API-Schlüssel eingetragen. Das sind Beispielzutaten, damit du den Ablauf siehst.</p>`}
      ${found.length
        ? html`<p className="text-sm font-semibold mb-2"><span className="tnum">${found.length}</span> Lebensmittel erkannt. Tippe, um welche abzuwählen.</p>
          <ul className="flex flex-wrap gap-2">
            ${found.map((n) => { const on = picked.includes(n); return html`<li key=${n}>
              <button onClick=${() => toggle(n)} aria-pressed=${on} className=${`rounded-full pl-2 pr-3 py-1.5 text-sm font-semibold flex items-center gap-1.5 border-2 transition ${on ? 'bg-brand-soft border-brand text-ink' : 'bg-surface border-line text-muted line-through'}`}>
                <span aria-hidden="true">${emojiFor(n)}</span>${n}
              </button>
            </li>`; })}
          </ul>
          <button onClick=${() => onApply(picked)} disabled=${!picked.length} className="mt-5 w-full rounded-2xl bg-brand text-onbrand py-4 font-semibold text-[16px] flex items-center justify-center gap-2 disabled:opacity-40 hover:brightness-110 transition">
            <${Ic.Check} size=${19} /><span className="tnum">${picked.length}</span> Zutaten übernehmen
          </button>`
        : html`<div className="rounded-3xl border-2 border-dashed border-line p-6 text-center">
            <${Ic.SearchX} size=${28} className="mx-auto text-muted" />
            <p className="font-semibold mt-2">Nichts erkannt</p>
            <p className="text-sm text-muted mt-1">Versuch es mit mehr Licht oder näher dran.</p>
          </div>`}
      <button onClick=${() => { setPhase('pick'); setPhoto(null); }} className="mt-2.5 w-full rounded-2xl border border-line py-3 font-semibold text-sm text-ink">Neues Foto</button>
    </div>`}

    ${error && html`<p className="mt-4 rounded-xl bg-warn/10 text-warn text-sm px-3 py-2 flex gap-2 anim-fade" role="alert"><${Ic.AlertCircle} size=${16} className="shrink-0 mt-0.5" />${error}</p>`}
  <//>`;
}

/* ---------- Einstellungen ---------- */
function Settings({ onClose, onChange }) {
  const current = getKey();
  const [key, setKey] = useState(current);
  const [model, setModel] = useState(getModel);
  const pickModel = (id) => { store.set('model', id); setModel(id); };
  const [show, setShow] = useState(false);
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);
  const save = async (e) => {
    e.preventDefault();
    const k = cleanKey(key);
    if (!k.startsWith('sk-ant-')) return setError('Ein Anthropic-Schlüssel beginnt mit „sk-ant-“. Kopier ihn am besten direkt aus der Console.');
    setChecking(true); setError('');
    try {
      await testKey(k);
      store.set('apiKey', k);
      onChange('Schlüssel funktioniert. Ab jetzt kocht Claude live.');
    } catch (err) {
      setError(err.message);
    } finally {
      setChecking(false);
    }
  };
  const remove = () => { store.set('apiKey', ''); onChange('Schlüssel entfernt.'); };
  return html`<${Sheet} onClose=${onClose} label="Einstellungen">
    <h2 className="font-display text-[26px] font-extrabold leading-tight pr-12">Einstellungen</h2>
    <div className=${`mt-4 rounded-2xl px-4 py-3 flex items-center gap-3 ${current ? 'bg-brand-soft' : 'bg-surface2'}`}>
      <span className=${`w-2.5 h-2.5 rounded-full shrink-0 ${current ? 'bg-brand' : 'bg-accent'}`}></span>
      <div className="min-w-0">
        <p className="font-semibold text-sm">${current ? 'Mit Claude verbunden' : 'Beispielmodus'}</p>
        <p className="text-xs text-muted">${current ? `Schlüssel …${current.slice(-4)} · ${MODELS[model].name}` : 'Ohne Schlüssel kann Claude nicht zu deinen Zutaten kochen.'}</p>
      </div>
    </div>

    <form onSubmit=${save} noValidate>
      <label htmlFor="api-key" className="block text-sm font-semibold mt-5 mb-1.5">Anthropic API-Schlüssel</label>
      <div className="flex items-center gap-2 rounded-2xl bg-surface2 border border-transparent focus-within:border-brand pl-4 pr-1.5 py-1.5">
        <input id="api-key" type=${show ? 'text' : 'password'} value=${key} onInput=${(e) => { setKey(e.target.value); setError(''); }} placeholder="sk-ant-…" autoComplete="off" autoCapitalize="off" spellCheck="false" className="bg-transparent outline-none flex-1 min-w-0 text-[15px] py-1.5 font-mono placeholder:text-muted placeholder:font-sans" />
        <button type="button" onClick=${() => setShow(!show)} className="w-9 h-9 grid place-items-center rounded-xl text-muted hover:text-ink" aria-label=${show ? 'Schlüssel verbergen' : 'Schlüssel anzeigen'}>${React.createElement(show ? Ic.EyeOff : Ic.Eye, { size: 18 })}</button>
      </div>
      ${error && html`<p className="mt-2 rounded-xl bg-warn/10 text-warn text-sm px-3 py-2 flex gap-2" role="alert"><${Ic.AlertCircle} size=${16} className="shrink-0 mt-0.5" />${error}</p>`}
      <button type="submit" disabled=${!cleanKey(key) || checking} className="mt-3 w-full rounded-2xl bg-brand text-onbrand py-3.5 font-semibold flex items-center justify-center gap-2 disabled:opacity-40 hover:brightness-110 transition">
        ${checking
          ? html`<${Ic.Loader2} size=${18} className="animate-spin" />Prüfe bei Anthropic …`
          : html`<${Ic.KeyRound} size=${18} />${cleanKey(key) === current ? 'Schlüssel testen' : 'Prüfen und speichern'}`}
      </button>
    </form>
    ${current && html`<button onClick=${remove} className="mt-2.5 w-full rounded-2xl border border-line py-3 font-semibold text-sm text-warn hover:bg-warn/10 transition">Schlüssel entfernen</button>`}

    <p className="text-sm font-semibold mt-6 mb-1.5">Modell</p>
    <div className="flex flex-col gap-2" role="radiogroup" aria-label="Modell">
      ${Object.entries(MODELS).map(([id, m]) => html`<button type="button" key=${id} role="radio" aria-checked=${model === id} onClick=${() => pickModel(id)}
        className=${`flex items-center gap-3 rounded-2xl border-2 px-4 py-3 text-left transition ${model === id ? 'border-brand bg-brand-soft' : 'border-line hover:border-brand/40'}`}>
        <span className=${`w-5 h-5 rounded-full border-2 grid place-items-center shrink-0 ${model === id ? 'border-brand' : 'border-line'}`}>${model === id && html`<span className="w-2.5 h-2.5 rounded-full bg-brand"></span>`}</span>
        <span className="min-w-0"><span className="block font-semibold text-sm">${m.name}</span><span className="block text-xs text-muted">${m.note}</span></span>
      </button>`)}
    </div>

    <ul className="mt-5 flex flex-col gap-2.5 text-sm text-muted">
      <li className="flex gap-2"><${Ic.ShieldCheck} size=${16} className="shrink-0 mt-0.5 text-brand" /><span>Der Schlüssel bleibt nur auf diesem Gerät gespeichert. Die App schickt ihn ausschließlich an Anthropic.</span></li>
      <li className="flex gap-2"><${Ic.Wallet} size=${16} className="shrink-0 mt-0.5 text-brand" /><span>Jede Anfrage kostet etwas von deinem Anthropic-Guthaben. Wie viel, hängt vom Modell ab.</span></li>
      <li className="flex gap-2"><${Ic.ExternalLink} size=${16} className="shrink-0 mt-0.5 text-brand" /><span>Einen Schlüssel erstellst du unter <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" className="text-brand font-semibold underline">console.anthropic.com</a>.</span></li>
    </ul>
  <//>`;
}

      <span className="text-[18px] leading-none" aria-hidden="true">${emojiFor(x.name)}</span>
      <span className="min-w-0 flex-1">
        <span className=${`block font-medium text-[15px] ${x.done ? 'line-through text-muted' : ''}`}>${x.name}</span>

      <${Ic.Plus} size=${18} className="text-muted shrink-0" />
      <label htmlFor="shop-input" className="sr-only">Artikel hinzufügen</label>

          ${done.length > 0 && html`<div>

              <h2 className="text-xs uppercase tracking-wider font-semibold text-muted">Im Korb · <span className="tnum">${done.length}</span></h2>
              <button onClick=${onClearDone} className="text-sm text-muted hover:text-ink">In den Kühlschrank</button>
            </div>
            <ul className="rounded-3xl bg-surface border border-line divide-y divide-line">${done.map(Row)}</ul>
          </div>`}
        </div>`}
  </div>`;
}

      const m = i + 1;

}

function Season({ shop, onAddShop }) {
  const [month, setMonth] = useState(thisMonth);
  const [filter, setFilter] = useState('alle');
  const chipsRef = useRef(null);
  useEffect(() => {
    const el = chipsRef.current && chipsRef.current.querySelector('[aria-pressed="true"]');
    if (el) el.scrollIntoView({ block: 'nearest', inline: 'center' });
  }, [month]);

  const prev = month === 1 ? 12 : month - 1, next = month === 12 ? 1 : month + 1;
  const fresh = inSeason(month).filter((x) => !x.s.includes(prev));
  const ending = inSeason(month).filter((x) => !x.s.includes(next));
  const list = SEASON
    .filter((x) => (filter === 'alle' || x.c === filter) && (x.s.includes(month) || (x.l && x.l.includes(month))))
    .sort((a, b) => (b.s.includes(month) - a.s.includes(month)) || a.n.localeCompare(b.n, 'de'));
  const range = (x) => (x.s.length === 12 ? 'ganzjährig' : x.s.length === 1 ? `nur im ${MONTHS[x.s[0] - 1]}` : `${MONTHS_SHORT[x.s[0] - 1]} – ${MONTHS_SHORT[x.s[x.s.length - 1] - 1]}`);
  const onList = (n) => shop.some((s) => s.name.toLowerCase() === n.toLowerCase() && !s.done);

  return html`<div className="pb-6">
    <header className="gutter pt-5 pb-3">
      <p className="text-muted text-sm flex items-center gap-1"><${Ic.MapPin} size=${14} />Regional aus Deutschland</p>
      <h1 className="font-display text-[28px] leading-tight font-extrabold mt-1">Saisonkalender</h1>
      <div ref=${chipsRef} className="flex gap-2 mt-4 overflow-x-auto no-scrollbar -mx-1 px-1" role="group" aria-label="Monat">
        ${MONTHS_SHORT.map((label, i) => html`<button key=${label} onClick=${() => setMonth(i + 1)} aria-pressed=${month === i + 1}
          className=${`shrink-0 rounded-full px-3.5 py-1.5 text-sm font-medium transition ${month === i + 1 ? 'bg-brand text-onbrand' : 'bg-surface text-muted border border-line hover:text-ink'} ${i + 1 === thisMonth() && month !== i + 1 ? 'border-brand/50 text-brand' : ''}`}>${label}</button>`)}
      </div>
    </header>

    <div className="gutter flex flex-col gap-5">
      ${(fresh.length > 0 || ending.length > 0) && html`<div className="grid grid-cols-2 gap-2.5">
        <div className="rounded-2xl bg-brand-soft p-3.5 min-w-0">
          <p className="text-[11px] uppercase tracking-wider font-bold text-brand flex items-center gap-1"><${Ic.Sprout} size=${13} />Neu im ${MONTHS_SHORT[month - 1]}</p>
          <p className="text-sm font-semibold mt-1.5 leading-snug">${fresh.length ? fresh.map((x) => x.n).join(', ') : 'Nichts Neues'}</p>
        </div>
        <div className="rounded-2xl bg-accent-soft p-3.5 min-w-0">
          <p className="text-[11px] uppercase tracking-wider font-bold text-accent flex items-center gap-1"><${Ic.Hourglass} size=${13} />Letzte Chance</p>
          <p className="text-sm font-semibold mt-1.5 leading-snug">${ending.length ? ending.map((x) => x.n).join(', ') : 'Nichts endet'}</p>
        </div>
      </div>`}

      <div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1">
          ${[['alle', 'Alles'], ['g', 'Gemüse'], ['o', 'Obst'], ['k', 'Kräuter']].map(([k, label]) => html`
            <button key=${k} onClick=${() => setFilter(k)} className=${`shrink-0 rounded-full px-3.5 py-1.5 text-sm font-medium transition ${filter === k ? 'bg-ink text-bg' : 'bg-surface text-muted border border-line hover:text-ink'}`}>${label}</button>`)}
        </div>
        <div className="flex items-center gap-4 text-xs text-muted mt-3">
          <span className="flex items-center gap-1.5"><span className="w-[5px] h-3 rounded-sm bg-brand"></span>Erntesaison</span>
          <span className="flex items-center gap-1.5"><span className="w-[5px] h-3 rounded-sm bg-brand/30"></span>aus dem Lager</span>
          <span className="ml-auto tnum">${list.length} Sorten</span>
        </div>
      </div>

      ${list.length
        ? html`<ul className="rounded-3xl bg-surface border border-line divide-y divide-line">
            ${list.map((x) => { const fresh = x.s.includes(month); const added = onList(x.n); return html`<li key=${x.n} className="flex items-center gap-3 pl-4 pr-2 py-2.5">
              <span className="text-[22px] leading-none w-7 text-center" aria-hidden="true">${x.e}</span>
              <div className="min-w-0 flex-1">
                <p className="font-semibold text-[15px] truncate">${x.n}</p>
                <p className="text-xs text-muted">${fresh ? range(x) : 'aus dem Lager'}</p>
              </div>
              <${MonthBar} item=${x} month=${month} />
              <button onClick=${() => onAddShop(x.n)} disabled=${added} className=${`w-9 h-9 rounded-full grid place-items-center shrink-0 transition ${added ? 'text-brand' : 'text-muted hover:text-ink hover:bg-surface2'}`} aria-label=${added ? `${x.n} steht auf der Einkaufsliste` : `${x.n} auf die Einkaufsliste`}>
                ${React.createElement(added ? Ic.Check : Ic.Plus, { size: 18, strokeWidth: 2.4 })}
              </button>
            </li>`; })}
          </ul>`
        : html`<p className="text-sm text-muted">In dieser Kategorie ist im ${MONTHS[month - 1]} nichts regional verfügbar.</p>`}

      <p className="text-xs text-muted flex gap-1.5"><${Ic.Info} size=${14} className="shrink-0 mt-px" />Richtwerte für Freiland-Ware. Je nach Region und Wetter verschiebt sich die Saison um ein paar Wochen.</p>
    </div>
  </div>`;
}

/* ---------- Tab: Favoriten ---------- */
function Saved({ saved, onOpen, onRecipes }) {
  return html`<div className="gutter pt-5 pb-6">
    <h1 className="font-display text-[26px] font-extrabold">Gemerkt</h1>
    <p className="text-sm text-muted mt-1">Deine Lieblingsrezepte, auch wenn der Kühlschrank wieder voll ist.</p>
    ${saved.length
      ? html`<ul className="flex flex-col gap-2.5 mt-5">${saved.map((r) => html`<li key=${r.id}>
          <button onClick=${() => onOpen(r)} className="w-full text-left rounded-2xl bg-surface border border-line p-3.5 flex items-center gap-3 hover:border-brand/50 transition">
            <${RecipeTile} kind=${r.kind} />
            <div className="min-w-0 flex-1">
              <p className="font-semibold truncate">${r.name}</p>
              <p className="text-xs text-muted">${r.kind === 'shop' ? `Fehlt: ${r.missing.join(', ')}` : 'Sofort kochbar'}</p>
            </div>
            <${TimeBadge} time=${r.time} />
          </button>
        </li>`)}</ul>`
      : html`<div className="mt-6 rounded-3xl border-2 border-dashed border-line p-6 text-center">
          <${Ic.Heart} size=${30} className="mx-auto text-accent" />
          <p className="font-semibold mt-2">Noch nichts gemerkt</p>
          <p className="text-sm text-muted mt-1">Tippe in einem Rezept auf das Herz, um es hier zu sammeln.</p>
          <button onClick=${onRecipes} className="mt-4 rounded-full bg-brand text-onbrand px-5 py-2.5 text-sm font-semibold">Zu den Rezepten</button>
        </div>`}
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState('fridge');
  const [items, setItems] = useState(() => store.get('fridge', null) || EXAMPLE_FRIDGE);
  const [example, setExample] = useState(() => !store.get('fridge', null));
  const [recipes, setRecipes] = useState({ status: 'idle' });
  const [shop, setShop] = useState(() => store.get('shop', []));
  const [saved, setSaved] = useState(() => store.get('saved', []));
  const [selected, setSelected] = useState(null);
  const [scanOpen, setScanOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [live, setLive] = useState(() => !!getKey());
  const [toast, setToast] = useState(null);
  const scroller = useRef(null);

  const showToast = (msg, icon = 'CheckCircle2') => setToast({ msg, icon, id: Date.now() });
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2800); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [tab]);
  useEffect(() => { if (!example) store.set('fridge', items); }, [items, example]);
  useEffect(() => store.set('shop', shop), [shop]);
  useEffect(() => store.set('saved', saved), [saved]);

  const go = (t) => { setTab(t); setSelected(null); };
  const addItems = (list) => {
    const clean = list.map((x) => x.trim()).filter(Boolean);
    if (!clean.length) return;
    setExample(false);
    setItems((cur) => [...cur, ...clean.filter((n, i) => !cur.some((c) => c.toLowerCase() === n.toLowerCase()) && clean.findIndex((m) => m.toLowerCase() === n.toLowerCase()) === i)]);
  };
  const removeItem = (n) => { setExample(false); setItems((cur) => cur.filter((x) => x !== n)); };

  const cook = async () => {
    if (!items.length) { go('fridge'); return; }
    const basedOn = [...items];
    setTab('recipes'); setSelected(null); setRecipes({ status: 'loading' });
    try {
      const [data] = await Promise.all([suggestRecipes(basedOn), wait(1200)]);
      // Ohne Schlüssel und Server keine Rezepte vortäuschen, die nicht zu den Zutaten passen.
      if (data.demo) { setRecipes({ status: 'nokey', basedOn }); return; }
      const cats = groupRecipes(data.recipes || []);
      if (!cats.length) throw new Error('Der Chefkoch hat keine Rezepte geliefert. Versuch es noch mal.');
      setRecipes({ status: 'done', demo: false, basedOn, cats });
    } catch (err) {
      setRecipes({ status: 'idle' });
      showToast(err.message, 'AlertCircle');
    }
  };
  const showExamples = () => setRecipes({ status: 'done', demo: true, basedOn: EXAMPLE_FRIDGE, cats: groupRecipes(DEMO_RECIPES) });

  const toggleSave = (r) => setSaved((s) => {
    const has = s.some((x) => x.id === r.id);
    showToast(has ? 'Aus den Favoriten entfernt.' : 'Rezept gemerkt.', has ? 'HeartOff' : 'Heart');
    return has ? s.filter((x) => x.id !== r.id) : [r, ...s];
  });
  const addShop = (r) => {
    const fresh = r.missing.filter((m) => !shop.some((s) => s.name.toLowerCase() === m.toLowerCase()));
    setShop((s) => [...s, ...fresh.map((name) => ({ name, from: r.name, done: false }))]);
    showToast(`${fresh.length} ${fresh.length === 1 ? 'Zutat' : 'Zutaten'} auf der Einkaufsliste.`, 'ShoppingCart');
  };
  const toggleShop = (name) => setShop((s) => s.map((x) => (x.name === name ? { ...x, done: !x.done } : x)));
  const addSeasonal = (name) => {
    if (shop.some((s) => s.name.toLowerCase() === name.toLowerCase() && !s.done)) return;
    setShop((s) => [...s.filter((x) => x.name.toLowerCase() !== name.toLowerCase()), { name, from: 'Saisonkalender', done: false }]);
    showToast(`${name} steht auf der Einkaufsliste.`, 'ShoppingCart');
  };
  const addOwn = (name) => { const n = name.trim(); if (n && !shop.some((s) => s.name.toLowerCase() === n.toLowerCase())) setShop((s) => [...s, { name: n, from: '', done: false }]); };
  const stockUp = () => {
    const bought = shop.filter((x) => x.done).map((x) => x.name);
    addItems(bought);
    setShop((s) => s.filter((x) => !x.done));
    showToast(`${bought.length} ${bought.length === 1 ? 'Zutat' : 'Zutaten'} in den Kühlschrank gelegt.`, 'Refrigerator');
  };
  const applyScan = (list) => {
    addItems(list); setScanOpen(false); go('fridge');
    showToast(`${list.length} Zutaten aus dem Foto übernommen.`, 'ScanLine');
  };

  const openShop = shop.filter((x) => !x.done).length;
  const nav = [['fridge', 'Kühlschrank', 'Refrigerator'], ['recipes', 'Rezepte', 'ChefHat'], ['scan'], ['season', 'Saison', 'Leaf'], ['shop', 'Einkauf', 'ShoppingCart']];

  return html`<div className="h-full flex items-center justify-center gap-14 sm:py-6">
    <aside className="hidden lg:block w-[300px] shrink-0">
      <p className="text-xs uppercase tracking-[.16em] font-semibold text-brand">Klickbarer Prototyp</p>
      <h1 className="font-display text-5xl font-extrabold leading-[1.02] mt-3">Restekoch AI</h1>
      <p className="text-muted mt-4 leading-relaxed">Reste rein, Rezepte raus. Die App erkennt per Foto, was im Kühlschrank liegt, und schlägt Gerichte vor, die sofort gehen oder nur einen kleinen Einkauf brauchen.</p>
      <ol className="mt-7 flex flex-col gap-3 text-sm">
        ${['Zutaten eintippen oder Kühlschrank fotografieren', '„Rezepte vorschlagen“ tippen', 'Rezept öffnen und Schritt für Schritt kochen', 'Fehlende Zutaten landen auf der Einkaufsliste'].map((s, i) => html`
          <li key=${i} className="flex gap-3"><span className="w-6 h-6 rounded-full bg-brand-soft text-brand grid place-items-center text-xs font-bold shrink-0">${i + 1}</span><span className="pt-0.5">${s}</span></li>`)}
      </ol>
    </aside>

    <div className="relative w-full h-full sm:w-[400px] sm:h-[844px] sm:max-h-full sm:rounded-[48px] sm:border-[10px] sm:border-[#18221a] sm:shadow-2xl overflow-hidden bg-bg flex flex-col shrink-0">
      <div className="hidden sm:flex items-center justify-between px-7 pt-3 pb-1 text-xs font-semibold tnum shrink-0">
        <span>9:41</span>
        <span className="w-24 h-6 rounded-full bg-[#18221a] -mt-1"></span>
        <span className="flex items-center gap-1"><${Ic.Signal} size=${14} /><${Ic.Wifi} size=${14} /><${Ic.BatteryFull} size=${16} /></span>
      </div>

      <main ref=${scroller} className="flex-1 min-h-0 overflow-y-auto no-scrollbar">
        ${tab === 'fridge' && html`<${Fridge} items=${items} example=${example} shopCount=${openShop} onAdd=${addItems} onRemove=${removeItem} onClear=${() => { setExample(false); setItems([]); }} onScan=${() => setScanOpen(true)} onCook=${cook} onShop=${() => go('shop')} live=${live} onSettings=${() => setSettingsOpen(true)} onSeason=${() => go('season')} />`}
        ${tab === 'recipes' && html`<${Recipes} state=${recipes} saved=${saved} onOpen=${setSelected} onCook=${cook} onFridge=${() => go('fridge')} onSettings=${() => setSettingsOpen(true)} onExamples=${showExamples} onSaved=${() => go('saved')} />`}
        ${tab === 'season' && html`<${Season} shop=${shop} onAddShop=${addSeasonal} />`}
        ${tab === 'shop' && html`<${Shopping} list=${shop} onToggle=${toggleShop} onAdd=${addOwn} onClearDone=${stockUp} />`}
        ${tab === 'saved' && html`<${Saved} saved=${saved} onOpen=${setSelected} onRecipes=${() => go('recipes')} />`}
      </main>

      <nav className="shrink-0 bg-surface border-t border-line gutter pt-1.5 relative z-30" style=${{ paddingBottom: 'max(10px, env(safe-area-inset-bottom, 0px))' }} aria-label="Hauptnavigation">
        <ul className="grid grid-cols-5 items-end">
          ${nav.map(([k, label, icon]) => k === 'scan'
            ? html`<li key="scan" className="flex justify-center">
                <button onClick=${() => setScanOpen(true)} className="-mt-7 w-[58px] h-[58px] rounded-full bg-brand text-onbrand grid place-items-center shadow-lg shadow-brand/40 ring-4 ring-surface hover:scale-105 active:scale-95 transition" aria-label="Kühlschrank scannen"><${Ic.Camera} size=${26} strokeWidth=${2.4} /></button>
              </li>`
            : html`<li key=${k}>
                <button onClick=${() => go(k)} aria-current=${tab === k ? 'page' : undefined} className=${`relative w-full flex flex-col items-center gap-0.5 py-1.5 text-[11px] font-semibold transition ${tab === k ? 'text-brand' : 'text-muted hover:text-ink'}`}>
                  ${React.createElement(Ic[icon], { size: 22, strokeWidth: tab === k ? 2.5 : 2 })}${label}
                  ${k === 'shop' && openShop > 0 && html`<span className="absolute top-0.5 left-1/2 ml-2 min-w-[18px] h-[18px] px-1 rounded-full bg-accent text-onbrand text-[10px] font-bold grid place-items-center tnum">${openShop}</span>`}
                </button>
              </li>`)}
        </ul>
      </nav>

      ${selected && html`<${Detail} key=${selected.id} fridge=${[...items, ...BASICS]} r=${selected} isSaved=${saved.some((s) => s.id === selected.id)} shopList=${shop} onClose=${() => setSelected(null)} onSave=${toggleSave} onAddShop=${addShop} />`}
      ${scanOpen && html`<${Scanner} onClose=${() => setScanOpen(false)} onApply=${applyScan} onSettings=${() => { setScanOpen(false); setSettingsOpen(true); }} />`}
      ${settingsOpen && html`<${Settings} onClose=${() => setSettingsOpen(false)} onChange=${(msg) => { setLive(!!getKey()); setSettingsOpen(false); showToast(msg, 'KeyRound'); }} />`}

      ${toast && html`<div key=${toast.id} className="toast absolute left-1/2 top-12 -translate-x-1/2 z-[60] w-[calc(100%-32px)] max-w-[360px] rounded-2xl bg-ink text-bg px-4 py-3 shadow-2xl flex items-center gap-2.5 text-sm font-medium" role="status">
        ${React.createElement(Ic[toast.icon], { size: 18, className: 'shrink-0' })}${toast.msg}
      </div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
