const findSub = (text) => { const t = text.toLowerCase(); return SUBS.find((s) => s.re.test(t)); };
// Hat der Kühlschrank alles, was der Ersatz braucht?
const subReady = (sub, fridge) => {
  if (!sub.needs.length) return false; // z. B. getrocknete Kräuter: nicht prüfbar
  const f = fridge.map((x) => x.toLowerCase());
  const has = (n) => f.some((x) => (n === 'ei' ? /^eier?$/.test(x) : x.includes(n)) || (n === 'käse' && /gouda|emmentaler|cheddar|bergkäse/.test(x)));
  return sub.any ? sub.needs.some(has) : sub.needs.every(has);
};
// Tipps für ein Rezept: zuerst fehlende Zutaten, dann Zutaten aus den Arbeitsschritten.
function tipsFor(r) {
  const out = [];
  for (const m of r.missing) {
    const s = findSub(m);
    out.push({ key: 'm:' + m, label: m, entry: s, missing: true });
  }
  const text = r.steps.join(' ').toLowerCase();
  for (const s of SUBS) {
    if (out.some((o) => o.entry === s)) continue;
    if (s.name === 'Käse' && out.some((o) => o.entry && /parmesan|mozzarella|feta/i.test(o.entry.name))) continue;
    if (s.name === 'Ei' && out.some((o) => o.entry && o.entry.name === 'Eigelb')) continue;
    if (s.re.test(text)) out.push({ key: 's:' + s.name, label: s.name, entry: s, missing: false });
  }
  return out;
}

const store = {
  get(k, fallback) { try { const v = localStorage.getItem('restekoch:' + k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem('restekoch:' + k, JSON.stringify(v)); } catch {} },
};
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const plain = (s) => s.replace(/\*\*|__|[*_`]/g, '').replace(/🛒|⏱️?/g, '').trim();
const afterColon = (s) => plain(s.includes(':') ? s.slice(s.indexOf(':') + 1) : s);
const minutesOf = (t) => { const m = (t || '').match(/\d+/); return m ? +m[0] : null; };

// Markdown des Chefkoch-Prompts in Kategorien und Rezepte zerlegen.
function parseRecipes(md) {
  const cats = [];
  let cat = null, rec = null;
  for (const raw of md.split('\n')) {
    const line = raw.trim();
    if (!line || /^-{3,}$/.test(line)) continue;
    if (/^#\s/.test(line)) {
      const title = plain(line.replace(/^#\s*/, ''));
      cat = { kind: /kategorie\s*2|erweitert|einkauf/i.test(title) ? 'shop' : 'now', title, recipes: [] };
      cats.push(cat); rec = null; continue;
    }
    if (/^#{2,3}\s/.test(line)) {
      if (!cat) { cat = { kind: 'now', title: 'Rezepte', recipes: [] }; cats.push(cat); }
      rec = { id: '', name: plain(line.replace(/^#+\s*(\d+\.\s*)?/, '')), time: '', missing: [], steps: [], kind: cat.kind };
      rec.id = rec.name.toLowerCase().replace(/[^a-zäöüß0-9]+/g, '-');
      cat.recipes.push(rec); continue;
    }
    if (!rec) continue;
    if (/zubereitungszeit/i.test(line)) { rec.time = afterColon(line); continue; }
    if (/fehlende/i.test(line)) {
      rec.missing = afterColon(line).split(/,|\s+und\s+/).map((x) => x.replace(/\(.*?\)/g, '').trim()).filter(Boolean);
      continue;
    }
    if (/^(\d+[.)]|[-*•])\s+/.test(line)) { rec.steps.push(line.replace(/^(\d+[.)]|[-*•])\s+/, '')); continue; }
  }
  return cats.filter((c) => c.recipes.length);
}

function resizeImage(file, maxSide = 1568) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Das Bild konnte nicht gelesen werden. Versuch ein JPG oder PNG.'));
    img.src = URL.createObjectURL(file);
  });
}

// Ruft das Backend auf. Ist keins erreichbar (z. B. Vorschau ohne Server), kommt { demo: true } zurück.
async function api(url, body) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch { return { demo: true }; }
  if (res.status === 404 || res.status === 405) return { demo: true };
  const data = await res.json().catch(() => null);
  if (!data) return { demo: true };
  if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
  return data;
}

      <button onClick=${() => onSave(recipe)} className=${`w-10 h-10 mt-1 rounded-full grid place-items-center border shrink-0 transition ${isSaved ? 'bg-accent text-onbrand border-accent' : 'border-line text-muted hover:text-ink'}`} aria-pressed=${isSaved} aria-label="Rezept merken">
        <${Ic.Heart} size=${18} fill=${isSaved ? 'currentColor' : 'none'} />
      </button>
    </div>

    <div className="grid grid-cols-2 gap-2.5 mt-4">
      <div className="rounded-2xl bg-surface2 px-4 py-3">
        <p className="text-xs text-muted">Zubereitung</p>
        <p className="font-semibold mt-0.5 flex items-center gap-1.5 tnum"><${Ic.Clock} size=${15} className="text-brand" />${r.time || 'k. A.'}</p>
      </div>
      <div className="rounded-2xl bg-surface2 px-4 py-3">
        <p className="text-xs text-muted">Arbeitsschritte</p>
        <p className="font-semibold mt-0.5 flex items-center gap-1.5 tnum"><${Ic.ListOrdered} size=${15} className="text-brand" />${r.steps.length}</p>
      </div>
    </div>

    ${r.missing.length > 0 && html`<div className="mt-4 rounded-3xl bg-accent-soft p-4">
      <p className="text-xs uppercase tracking-wider font-bold text-accent flex items-center gap-1.5"><${Ic.ShoppingCart} size=${14} strokeWidth=${2.6} />Fehlende Zutaten</p>
      <ul className="flex flex-wrap gap-2 mt-2.5">
        ${r.missing.map((m) => html`<li key=${m} className="rounded-full bg-surface text-ink font-semibold text-sm px-3 py-1.5 flex items-center gap-1.5"><span aria-hidden="true">${emojiFor(m)}</span>${m}</li>`)}
      </ul>
      <button onClick=${() => onAddShop(r)} disabled=${!missingOpen.length} className="mt-3.5 w-full rounded-2xl bg-accent text-onbrand py-3 font-semibold text-sm flex items-center justify-center gap-2 disabled:opacity-50 hover:brightness-110 transition">
        ${missingOpen.length ? html`<${Ic.Plus} size=${17} />Auf die Einkaufsliste` : html`<${Ic.Check} size=${17} />Steht schon auf der Liste`}
      </button>
    </div>`}

    ${recipe.missing.length > 0 && r.missing.length === 0 && html`<div className="mt-4 rounded-3xl bg-brand-soft p-4 flex items-center gap-2.5 text-sm font-semibold text-brand"><${Ic.PartyPopper} size=${20} className="shrink-0" />Alles ersetzt – du kannst sofort loskochen!</div>`}

    <${SubTips} r=${recipe} fridge=${fridge} swapped=${swapped} onSwap=${onSwap} />

    <h3 className="font-display text-lg font-bold mt-5 mb-2">So geht's</h3>
    <ol className="flex flex-col gap-3">
      ${r.steps.map((s, i) => html`<li key=${i} className="flex gap-3">
        <span className="w-7 h-7 rounded-full bg-brand-soft text-brand grid place-items-center text-sm font-bold shrink-0 tnum">${i + 1}</span>
        <p className="text-[15px] leading-relaxed pt-0.5 min-w-0" dangerouslySetInnerHTML=${{ __html: inline(s) }}></p>
      </li>`)}
    </ol>
    <p className="text-xs text-muted mt-5 flex gap-1.5"><${Ic.Info} size=${14} className="shrink-0 mt-px" />Salz, Pfeffer, Öl, Wasser und Zucker setzt das Rezept als vorhanden voraus.</p>
  <//>`;
}

/* ---------- Foto-Scan ---------- */
function Scanner({ onClose, onApply }) {
  const [photo, setPhoto] = useState(null);
  const [phase, setPhase] = useState('pick'); // pick | scanning | result
  const [found, setFound] = useState([]);
  const [picked, setPicked] = useState([]);
  const [demo, setDemo] = useState(false);
  const [error, setError] = useState('');
  const fileRef = useRef(null);

  const analyze = async (dataUrl) => {
    setPhase('scanning'); setError('');
    try {
      const [data] = await Promise.all([dataUrl ? api('/api/analyze-image', { image: dataUrl }) : Promise.resolve({ demo: true }), wait(1400)]);
      const list = data.demo ? DEMO_SCAN : data.ingredients;
      setDemo(!!data.demo); setFound(list); setPicked(list); setPhase('result');
    } catch (err) {
      setError(err.message); setPhase('pick');
    }
  };
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) return setError('Das ist keine Bilddatei. Wähl ein Foto im JPG-, PNG- oder WebP-Format.');
    try { const url = await resizeImage(f); setPhoto(url); analyze(url); } catch (err) { setError(err.message); }
  };
  const toggle = (n) => setPicked((p) => (p.includes(n) ? p.filter((x) => x !== n) : [...p, n]));

  return html`<${Sheet} onClose=${onClose} label="Kühlschrank scannen">
    <h2 className="font-display text-[26px] font-extrabold leading-tight pr-12">Kühlschrank scannen</h2>
    <p className="text-sm text-muted mt-1">Tür auf, Foto machen. Je heller, desto besser erkennt die KI die Lebensmittel.</p>
    <input ref=${fileRef} id="scan-photo" type="file" accept="image/*" capture="environment" className="hidden" onChange=${onFile} />

    ${phase === 'pick' && html`<div className="grid grid-cols-2 gap-2 mt-5">
      <button onClick=${() => fileRef.current && fileRef.current.click()} className="rounded-2xl border-2 border-dashed border-line hover:border-brand/50 py-6 flex flex-col items-center gap-1.5 text-sm font-medium text-muted transition">
        <${Ic.Camera} size=${24} className="text-brand" />Foto aufnehmen<span className="text-xs font-normal">oder hochladen</span>
      </button>
      <button onClick=${() => { setPhoto(null); analyze(null); }} className="rounded-2xl border-2 border-dashed border-line hover:border-brand/50 py-6 flex flex-col items-center gap-1.5 text-sm font-medium text-muted transition">
        <${Ic.Wand2} size=${24} className="text-accent" />Beispiel-Scan<span className="text-xs font-normal">ohne eigenes Foto</span>
      </button>
    </div>`}

    ${phase === 'scanning' && html`<div className="relative mt-5 rounded-3xl overflow-hidden aspect-[4/3] max-w-full bg-surface2 anim-fade">
      ${photo
        ? html`<img src=${photo} alt="Dein Kühlschrankfoto" className="w-full h-full object-cover" />`
        : html`<div className="w-full h-full grid grid-cols-4 place-items-center text-[34px] p-4" aria-hidden="true">${['🥚', '🍅', '🧀', '🥛', '🥒', '🥣', '🫑', '🧈'].map((e) => html`<span key=${e}>${e}</span>`)}</div>`}
      <div className="absolute inset-0 bg-brand/10"></div>
      <div className="scanline"></div>
      <span className="absolute left-3 bottom-3 rounded-full bg-black/60 text-white text-xs px-2.5 py-1 flex items-center gap-1.5"><${Ic.Loader2} size=${12} className="animate-spin" />Erkenne Lebensmittel …</span>
    </div>`}

    ${phase === 'result' && html`<div className="mt-5 anim-fade">
      ${demo && html`<p className="rounded-xl bg-surface2 text-muted text-xs px-3 py-2 mb-3 flex gap-2"><${Ic.Info} size=${14} className="shrink-0 mt-px" />Kein Server verbunden. Das sind Beispielzutaten, damit du den Ablauf siehst.</p>`}
      ${found.length
        ? html`<p className="text-sm font-semibold mb-2"><span className="tnum">${found.length}</span> Lebensmittel erkannt. Tippe, um welche abzuwählen.</p>
          <ul className="flex flex-wrap gap-2">
            ${found.map((n) => { const on = picked.includes(n); return html`<li key=${n}>
              <button onClick=${() => toggle(n)} aria-pressed=${on} className=${`rounded-full pl-2 pr-3 py-1.5 text-sm font-semibold flex items-center gap-1.5 border-2 transition ${on ? 'bg-brand-soft border-brand text-ink' : 'bg-surface border-line text-muted line-through'}`}>
                <span aria-hidden="true">${emojiFor(n)}</span>${n}
              </button>
            </li>`; })}
          </ul>
          <button onClick=${() => onApply(picked)} disabled=${!picked.length} className="mt-5 w-full rounded-2xl bg-brand text-onbrand py-4 font-semibold text-[16px] flex items-center justify-center gap-2 disabled:opacity-40 hover:brightness-110 transition">
            <${Ic.Check} size=${19} /><span className="tnum">${picked.length}</span> Zutaten übernehmen
          </button>`
        : html`<div className="rounded-3xl border-2 border-dashed border-line p-6 text-center">
            <${Ic.SearchX} size=${28} className="mx-auto text-muted" />
            <p className="font-semibold mt-2">Nichts erkannt</p>
            <p className="text-sm text-muted mt-1">Versuch es mit mehr Licht oder näher dran.</p>
          </div>`}
      <button onClick=${() => { setPhase('pick'); setPhoto(null); }} className="mt-2.5 w-full rounded-2xl border border-line py-3 font-semibold text-sm text-ink">Neues Foto</button>
    </div>`}

    ${error && html`<p className="mt-4 rounded-xl bg-warn/10 text-warn text-sm px-3 py-2 flex gap-2 anim-fade" role="alert"><${Ic.AlertCircle} size=${16} className="shrink-0 mt-0.5" />${error}</p>`}
  <//>`;
}

/* ---------- Tab: Einkaufsliste ---------- */
function Shopping({ list, onToggle, onAdd, onClearDone }) {
  const [draft, setDraft] = useState('');
  const open = list.filter((x) => !x.done), done = list.filter((x) => x.done);
  const Row = (x) => html`<li key=${x.name}>
    <button onClick=${() => onToggle(x.name)} className="w-full text-left flex items-center gap-3 px-4 py-3">
      <span className=${`w-6 h-6 rounded-lg border-2 grid place-items-center shrink-0 transition ${x.done ? 'bg-brand border-brand text-onbrand' : 'border-line'}`}>${x.done && html`<${Ic.Check} size=${15} strokeWidth=${3} />`}</span>
      <span className="text-[18px] leading-none" aria-hidden="true">${emojiFor(x.name)}</span>
      <span className="min-w-0 flex-1">
        <span className=${`block font-medium text-[15px] ${x.done ? 'line-through text-muted' : ''}`}>${x.name}</span>
        ${x.from && html`<span className="block text-xs text-muted truncate">für ${x.from}</span>`}
      </span>
    </button>
  </li>`;
  return html`<div className="gutter pt-5 pb-6">
    <h1 className="font-display text-[26px] font-extrabold">Einkaufsliste</h1>
    <p className="text-sm text-muted mt-1">Was für die Rezepte mit kleinem Einkauf noch fehlt.</p>
    <form onSubmit=${(e) => { e.preventDefault(); onAdd(draft); setDraft(''); }} className="mt-4 flex items-center gap-2 rounded-2xl bg-surface border border-line pl-3.5 pr-1.5 py-1.5 focus-within:border-brand transition">
      <${Ic.Plus} size=${18} className="text-muted shrink-0" />
      <label htmlFor="shop-input" className="sr-only">Artikel hinzufügen</label>
      <input id="shop-input" value=${draft} onInput=${(e) => setDraft(e.target.value)} placeholder="Eigenen Artikel hinzufügen" autoComplete="off" className="bg-transparent outline-none flex-1 min-w-0 text-[15px] py-1.5 placeholder:text-muted" />
      <button type="submit" disabled=${!draft.trim()} className="rounded-xl bg-brand text-onbrand px-3.5 py-2 text-sm font-semibold disabled:opacity-30">Dazu</button>
    </form>
    ${list.length === 0
      ? html`<div className="mt-6 rounded-3xl border-2 border-dashed border-line p-6 text-center">
          <${Ic.ShoppingCart} size=${30} className="mx-auto text-accent" />
          <p className="font-semibold mt-2">Nichts zu besorgen</p>
          <p className="text-sm text-muted mt-1">Öffne ein Rezept mit kleinem Einkauf und tippe auf „Auf die Einkaufsliste“.</p>
        </div>`
      : html`<div>
          <h2 className="text-xs uppercase tracking-wider font-semibold text-muted mt-6 mb-2">Noch holen · <span className="tnum">${open.length}</span></h2>
          ${open.length ? html`<ul className="rounded-3xl bg-surface border border-line divide-y divide-line">${open.map(Row)}</ul>` : html`<p className="text-sm text-muted">Alles im Korb.</p>`}
          ${done.length > 0 && html`<div>
            <div className="flex items-baseline justify-between mt-6 mb-2">
              <h2 className="text-xs uppercase tracking-wider font-semibold text-muted">Im Korb · <span className="tnum">${done.length}</span></h2>
              <button onClick=${onClearDone} className="text-sm text-muted hover:text-ink">In den Kühlschrank</button>
            </div>
            <ul className="rounded-3xl bg-surface border border-line divide-y divide-line">${done.map(Row)}</ul>
          </div>`}
        </div>`}
  </div>`;
}

/* ---------- Tab: Favoriten ---------- */
function Saved({ saved, onOpen, onRecipes }) {
  return html`<div className="gutter pt-5 pb-6">
    <h1 className="font-display text-[26px] font-extrabold">Gemerkt</h1>
    <p className="text-sm text-muted mt-1">Deine Lieblingsrezepte, auch wenn der Kühlschrank wieder voll ist.</p>
    ${saved.length
      ? html`<ul className="flex flex-col gap-2.5 mt-5">${saved.map((r) => html`<li key=${r.id}>
          <button onClick=${() => onOpen(r)} className="w-full text-left rounded-2xl bg-surface border border-line p-3.5 flex items-center gap-3 hover:border-brand/50 transition">
            <${RecipeTile} kind=${r.kind} />
            <div className="min-w-0 flex-1">
              <p className="font-semibold truncate">${r.name}</p>
              <p className="text-xs text-muted">${r.kind === 'shop' ? `Fehlt: ${r.missing.join(', ')}` : 'Sofort kochbar'}</p>
            </div>
            <${TimeBadge} time=${r.time} />
          </button>
        </li>`)}</ul>`
      : html`<div className="mt-6 rounded-3xl border-2 border-dashed border-line p-6 text-center">
          <${Ic.Heart} size=${30} className="mx-auto text-accent" />
          <p className="font-semibold mt-2">Noch nichts gemerkt</p>
          <p className="text-sm text-muted mt-1">Tippe in einem Rezept auf das Herz, um es hier zu sammeln.</p>
          <button onClick=${onRecipes} className="mt-4 rounded-full bg-brand text-onbrand px-5 py-2.5 text-sm font-semibold">Zu den Rezepten</button>
        </div>`}
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState('fridge');
  const [items, setItems] = useState(() => store.get('fridge', null) || EXAMPLE_FRIDGE);
  const [example, setExample] = useState(() => !store.get('fridge', null));
  const [recipes, setRecipes] = useState({ status: 'idle' });
  const [shop, setShop] = useState(() => store.get('shop', []));
  const [saved, setSaved] = useState(() => store.get('saved', []));
  const [selected, setSelected] = useState(null);
  const [scanOpen, setScanOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const scroller = useRef(null);

  const showToast = (msg, icon = 'CheckCircle2') => setToast({ msg, icon, id: Date.now() });
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2800); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [tab]);
  useEffect(() => { if (!example) store.set('fridge', items); }, [items, example]);
  useEffect(() => store.set('shop', shop), [shop]);
  useEffect(() => store.set('saved', saved), [saved]);

  const go = (t) => { setTab(t); setSelected(null); };
  const addItems = (list) => {
    const clean = list.map((x) => x.trim()).filter(Boolean);
    if (!clean.length) return;
    setExample(false);
    setItems((cur) => [...cur, ...clean.filter((n, i) => !cur.some((c) => c.toLowerCase() === n.toLowerCase()) && clean.findIndex((m) => m.toLowerCase() === n.toLowerCase()) === i)]);
  };
  const removeItem = (n) => { setExample(false); setItems((cur) => cur.filter((x) => x !== n)); };

  const cook = async () => {
    if (!items.length) { go('fridge'); return; }
    const basedOn = [...items];
    setTab('recipes'); setSelected(null); setRecipes({ status: 'loading' });
    try {
      const [data] = await Promise.all([api('/api/recipes', { ingredients: basedOn }), wait(1200)]);
      const md = data.demo ? DEMO_MD : data.markdown;
      const cats = parseRecipes(md);
      setRecipes({
        status: 'done', demo: !!data.demo, basedOn, cats,
        fallbackHtml: cats.length ? null : DOMPurify.sanitize(marked.parse(md)),
      });
      if (data.demo) showToast('Kein Server verbunden. Du siehst Beispielrezepte.', 'Info');
    } catch (err) {
      setRecipes({ status: 'idle' });
      showToast(err.message, 'AlertCircle');
    }
  };

  const toggleSave = (r) => setSaved((s) => {
    const has = s.some((x) => x.id === r.id);
    showToast(has ? 'Aus den Favoriten entfernt.' : 'Rezept gemerkt.', has ? 'HeartOff' : 'Heart');
    return has ? s.filter((x) => x.id !== r.id) : [r, ...s];
  });
  const addShop = (r) => {
    const fresh = r.missing.filter((m) => !shop.some((s) => s.name.toLowerCase() === m.toLowerCase()));
    setShop((s) => [...s, ...fresh.map((name) => ({ name, from: r.name, done: false }))]);
    showToast(`${fresh.length} ${fresh.length === 1 ? 'Zutat' : 'Zutaten'} auf der Einkaufsliste.`, 'ShoppingCart');
  };
  const toggleShop = (name) => setShop((s) => s.map((x) => (x.name === name ? { ...x, done: !x.done } : x)));
  const addOwn = (name) => { const n = name.trim(); if (n && !shop.some((s) => s.name.toLowerCase() === n.toLowerCase())) setShop((s) => [...s, { name: n, from: '', done: false }]); };
  const stockUp = () => {
    const bought = shop.filter((x) => x.done).map((x) => x.name);
    addItems(bought);
    setShop((s) => s.filter((x) => !x.done));
    showToast(`${bought.length} ${bought.length === 1 ? 'Zutat' : 'Zutaten'} in den Kühlschrank gelegt.`, 'Refrigerator');
  };
  const applyScan = (list) => {
    addItems(list); setScanOpen(false); go('fridge');
    showToast(`${list.length} Zutaten aus dem Foto übernommen.`, 'ScanLine');
  };

  const openShop = shop.filter((x) => !x.done).length;
  const nav = [['fridge', 'Kühlschrank', 'Refrigerator'], ['recipes', 'Rezepte', 'ChefHat'], ['scan'], ['shop', 'Einkauf', 'ShoppingCart'], ['saved', 'Gemerkt', 'Heart']];

  return html`<div className="h-full flex items-center justify-center gap-14 sm:py-6">
    <aside className="hidden lg:block w-[300px] shrink-0">
      <p className="text-xs uppercase tracking-[.16em] font-semibold text-brand">Klickbarer Prototyp</p>
      <h1 className="font-display text-5xl font-extrabold leading-[1.02] mt-3">Restekoch AI</h1>
      <p className="text-muted mt-4 leading-relaxed">Reste rein, Rezepte raus. Die App erkennt per Foto, was im Kühlschrank liegt, und schlägt Gerichte vor, die sofort gehen oder nur einen kleinen Einkauf brauchen.</p>
      <ol className="mt-7 flex flex-col gap-3 text-sm">
        ${['Zutaten eintippen oder Kühlschrank fotografieren', '„Rezepte vorschlagen“ tippen', 'Rezept öffnen und Schritt für Schritt kochen', 'Fehlende Zutaten landen auf der Einkaufsliste'].map((s, i) => html`
          <li key=${i} className="flex gap-3"><span className="w-6 h-6 rounded-full bg-brand-soft text-brand grid place-items-center text-xs font-bold shrink-0">${i + 1}</span><span className="pt-0.5">${s}</span></li>`)}
      </ol>
    </aside>

    <div className="relative w-full h-full sm:w-[400px] sm:h-[844px] sm:max-h-full sm:rounded-[48px] sm:border-[10px] sm:border-[#18221a] sm:shadow-2xl overflow-hidden bg-bg flex flex-col shrink-0">
      <div className="hidden sm:flex items-center justify-between px-7 pt-3 pb-1 text-xs font-semibold tnum shrink-0">
        <span>9:41</span>
        <span className="w-24 h-6 rounded-full bg-[#18221a] -mt-1"></span>
        <span className="flex items-center gap-1"><${Ic.Signal} size=${14} /><${Ic.Wifi} size=${14} /><${Ic.BatteryFull} size=${16} /></span>
      </div>

      <main ref=${scroller} className="flex-1 min-h-0 overflow-y-auto no-scrollbar">
        ${tab === 'fridge' && html`<${Fridge} items=${items} example=${example} shopCount=${openShop} onAdd=${addItems} onRemove=${removeItem} onClear=${() => { setExample(false); setItems([]); }} onScan=${() => setScanOpen(true)} onCook=${cook} onShop=${() => go('shop')} />`}
        ${tab === 'recipes' && html`<${Recipes} state=${recipes} saved=${saved} onOpen=${setSelected} onCook=${cook} onFridge=${() => go('fridge')} />`}
        ${tab === 'shop' && html`<${Shopping} list=${shop} onToggle=${toggleShop} onAdd=${addOwn} onClearDone=${stockUp} />`}
        ${tab === 'saved' && html`<${Saved} saved=${saved} onOpen=${setSelected} onRecipes=${() => go('recipes')} />`}
      </main>

      <nav className="shrink-0 bg-surface border-t border-line gutter pt-1.5 relative z-30" style=${{ paddingBottom: 'max(10px, env(safe-area-inset-bottom, 0px))' }} aria-label="Hauptnavigation">
        <ul className="grid grid-cols-5 items-end">
          ${nav.map(([k, label, icon]) => k === 'scan'
            ? html`<li key="scan" className="flex justify-center">
                <button onClick=${() => setScanOpen(true)} className="-mt-7 w-[58px] h-[58px] rounded-full bg-brand text-onbrand grid place-items-center shadow-lg shadow-brand/40 ring-4 ring-surface hover:scale-105 active:scale-95 transition" aria-label="Kühlschrank scannen"><${Ic.Camera} size=${26} strokeWidth=${2.4} /></button>
              </li>`
            : html`<li key=${k}>
                <button onClick=${() => go(k)} aria-current=${tab === k ? 'page' : undefined} className=${`relative w-full flex flex-col items-center gap-0.5 py-1.5 text-[11px] font-semibold transition ${tab === k ? 'text-brand' : 'text-muted hover:text-ink'}`}>
                  ${React.createElement(Ic[icon], { size: 22, strokeWidth: tab === k ? 2.5 : 2 })}${label}
                  ${k === 'shop' && openShop > 0 && html`<span className="absolute top-0.5 left-1/2 ml-2 min-w-[18px] h-[18px] px-1 rounded-full bg-accent text-onbrand text-[10px] font-bold grid place-items-center tnum">${openShop}</span>`}
                </button>
              </li>`)}
        </ul>
      </nav>

      ${selected && html`<${Detail} key=${selected.id} r=${selected} fridge=${[...items, ...BASICS]} isSaved=${saved.some((s) => s.id === selected.id)} shopList=${shop} onClose=${() => setSelected(null)} onSave=${toggleSave} onAddShop=${addShop} />`}
      ${scanOpen && html`<${Scanner} onClose=${() => setScanOpen(false)} onApply=${applyScan} />`}

      ${toast && html`<div key=${toast.id} className="toast absolute left-1/2 top-12 -translate-x-1/2 z-[60] w-[calc(100%-32px)] max-w-[360px] rounded-2xl bg-ink text-bg px-4 py-3 shadow-2xl flex items-center gap-2.5 text-sm font-medium" role="status">
        ${React.createElement(Ic[toast.icon], { size: 18, className: 'shrink-0' })}${toast.msg}
      </div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
